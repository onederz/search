<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://onederz.com/mobile-image/logo.webp">
  <title>Onederz · Staff Booking</title>

  <!-- Lexend font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Flaticon UIcons (uicons) stylesheet -->
  <link rel='stylesheet' href='https://cdn.uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn.uicons.flaticon.com/2.6.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>

  <style>
    /* ============================================================
       THEME VARIABLES – LIGHT (default)
    ============================================================ */
    :root {
      --bg-body: #e8ebef;
      --bg-body-deep: #d0d5dc;
      --bg-card: #eef0f3;
      --bg-card-deep: #e2e5ea;
      --bg-card-inner: #e4e7ec;
      --bg-elevated: #ffffff;
      --bg-subtle: #e6e9ee;
      --bg-hover: #dfe3e9;
      --bg-chip-in: #ecfdf5;
      --bg-chip-out: #fef2f2;
      --bg-chip-nights: #eff6ff;
      --bg-day-checkin: #d1fae5;
      --bg-day-checkout: #fee2e2;
      --bg-day-inrange: #e0e4ea;
      --bg-day-disabled: #e0e4ea;

      --border-soft: #d8dce3;
      --border-input: #d0d5dc;
      --border-input-hover: #b8bfc9;
      --border-input-focus: #94a3b8;

      --text-primary: #1e2a3a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --text-placeholder: #b8bfc9;
      --text-disabled: #a4acb8;

      --accent: #0d9488;
      --accent-soft: #5eead4;
      --accent-hover: #0f766e;
      --icon-color: #0d9488;
      --icon-color-selected: #0f766e;

      --btn-bg: #1e2a3a;
      --btn-bg-hover: #0f172a;
      --btn-ready-bg: #059669;
      --btn-ready-bg-hover: #047857;

      --shadow-card-carved:
        inset 0 4px 10px rgba(15, 23, 42, 0.10),
        inset 0 2px 4px rgba(15, 23, 42, 0.06),
        inset 0 -3px 6px rgba(255, 255, 255, 0.85),
        inset 0 -1px 2px rgba(255, 255, 255, 0.7);
      --shadow-input-inset:
        inset 0 2px 5px rgba(15, 23, 42, 0.10),
        inset 0 1px 2px rgba(15, 23, 42, 0.06),
        inset 0 -1px 2px rgba(255, 255, 255, 0.6);
      --shadow-menu:
        0 1px 0 rgba(255, 255, 255, 0.85),
        0 0 0 1px rgba(15, 23, 42, 0.06),
        0 16px 32px -12px rgba(15, 23, 42, 0.18);
      --shadow-nested-inset:
        inset 0 2px 4px rgba(15, 23, 42, 0.08),
        inset 0 1px 1px rgba(15, 23, 42, 0.05),
        inset 0 -1px 1px rgba(255, 255, 255, 0.6);
      --shadow-month-carved:
        inset 0 3px 8px rgba(15, 23, 42, 0.10),
        inset 0 1px 3px rgba(15, 23, 42, 0.06),
        inset 0 -2px 4px rgba(255, 255, 255, 0.75);
      --shadow-nav-btn:
        inset 0 2px 4px rgba(15, 23, 42, 0.1),
        inset 0 1px 2px rgba(15, 23, 42, 0.06),
        inset 0 -1px 2px rgba(255, 255, 255, 0.6);

      --switch-track: #d0d5dc;
      --switch-track-inner: #b8bfc9;
      --switch-thumb: #ffffff;
      --switch-thumb-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -2px 3px rgba(15, 23, 42, 0.15),
        0 2px 6px rgba(0, 0, 0, 0.12);
      --switch-icon: #94a3b8;
      --switch-active-icon: #f59e0b;
    }

    /* ============================================================
       THEME VARIABLES – DARK (warm graphite)
    ============================================================ */
    html.dark {
      --bg-body: #1a1a1c;
      --bg-body-deep: #0a0a0c;
      --bg-card: #1e1e21;
      --bg-card-deep: #141416;
      --bg-card-inner: #18181b;
      --bg-elevated: #2a2a2e;
      --bg-subtle: #18181b;
      --bg-hover: #26262a;
      --bg-chip-in: #1a3a2e;
      --bg-chip-out: #3d2222;
      --bg-chip-nights: #1f2f45;
      --bg-day-checkin: #2a5a44;
      --bg-day-checkout: #6b2e2e;
      --bg-day-inrange: #202024;
      --bg-day-disabled: #141416;

      --border-soft: #26262a;
      --border-input: #26262a;
      --border-input-hover: #3a3a42;
      --border-input-focus: #52525c;

      --text-primary: #f5f5f7;
      --text-secondary: #d4d4d8;
      --text-muted: #a1a1a8;
      --text-faint: #7a7a82;
      --text-placeholder: #55555d;
      --text-disabled: #3f3f45;

      --accent: #2dd4bf;
      --accent-soft: #5eead4;
      --accent-hover: #14b8a6;
      --icon-color: #2dd4bf;
      --icon-color-selected: #5eead4;

      --btn-bg: #0d9488;
      --btn-bg-hover: #0f766e;
      --btn-ready-bg: #059669;
      --btn-ready-bg-hover: #047857;

      --shadow-card-carved:
        inset 0 4px 12px rgba(0, 0, 0, 0.6),
        inset 0 2px 4px rgba(0, 0, 0, 0.5),
        inset 0 -3px 6px rgba(255, 255, 255, 0.03),
        inset 0 -1px 2px rgba(255, 255, 255, 0.02);
      --shadow-input-inset:
        inset 0 2px 6px rgba(0, 0, 0, 0.55),
        inset 0 1px 2px rgba(0, 0, 0, 0.45),
        inset 0 -1px 2px rgba(255, 255, 255, 0.03);
      --shadow-menu:
        0 1px 0 rgba(255, 255, 255, 0.06),
        0 0 0 1px rgba(0, 0, 0, 0.5),
        0 20px 40px -12px rgba(0, 0, 0, 0.7);
      --shadow-nested-inset:
        inset 0 2px 5px rgba(0, 0, 0, 0.5),
        inset 0 1px 2px rgba(0, 0, 0, 0.4),
        inset 0 -1px 2px rgba(255, 255, 255, 0.03);
      --shadow-month-carved:
        inset 0 3px 10px rgba(0, 0, 0, 0.55),
        inset 0 1px 3px rgba(0, 0, 0, 0.45),
        inset 0 -2px 4px rgba(255, 255, 255, 0.03);
      --shadow-nav-btn:
        inset 0 2px 5px rgba(0, 0, 0, 0.55),
        inset 0 1px 2px rgba(0, 0, 0, 0.4),
        inset 0 -1px 2px rgba(255, 255, 255, 0.03);

      --switch-track: #0f0f11;
      --switch-track-inner: #050507;
      --switch-thumb: #2e2e34;
      --switch-thumb-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -2px 3px rgba(0, 0, 0, 0.5),
        0 2px 6px rgba(0, 0, 0, 0.4);
      --switch-icon: #7a7a82;
      --switch-active-icon: #fbbf24;
    }

    /* global reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.4s ease;
      position: relative;
      background-image:
        radial-gradient(ellipse at center, transparent 20%, var(--bg-body-deep) 100%);
      overflow-x: hidden;
    }

    /* ============================================================
       PRELOAD STATE — hides content until overlay is done
    ============================================================ */
    body.preload .page-layout,
    body.preload .theme-switch {
      opacity: 0;
      pointer-events: none;
    }

    /* ============================================================
       LOADING OVERLAY
    ============================================================ */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      background: var(--bg-body);
      background-image: radial-gradient(ellipse at center, transparent 20%, var(--bg-body-deep) 100%);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Loader logo / spinner */
    .loader-logo {
      width: 150px;
      height: auto;
      animation: loaderPulse 1.6s ease-in-out infinite;
    }

    .loader-logo--light { display: block; }
    .loader-logo--dark  { display: none; }

    html.dark .loader-logo--light { display: none; }
    html.dark .loader-logo--dark  { display: block; }

    @keyframes loaderPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.06);
        opacity: 0.75;
      }
    }

    /* Spinner ring */
    .loader-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid var(--border-soft);
      border-top-color: var(--accent);
      animation: spinRing 0.9s linear infinite;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* Loading dots */
    .loader-dots {
      display: flex;
      gap: 0.6rem;
    }

    .loader-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .loader-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      40% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }

    .loader-text {
      font-family: 'Lexend', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }

    /* ============================================================
       ENTRANCE ANIMATION
    ============================================================ */
    @keyframes floatIn {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slideInFromLeft {
      0% {
        opacity: 0;
        transform: translateX(-40px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.3);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(13, 148, 136, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(13, 148, 136, 0);
      }
    }

    /* Once loaded, apply entrance animations */
    body.loaded .brand-block {
      animation: slideInFromLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    body.loaded .picker-card {
      animation: floatIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.1s;
    }

    body.loaded .theme-switch {
      animation: fadeInScale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.4s;
    }

    body.loaded .field-group {
      animation: floatIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.25s;
    }

    body.loaded .calendar-section {
      animation: floatIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.4s;
    }

    body.loaded .picker-footer {
      animation: floatIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.55s;
    }

    /* Optional subtle glow on the confirm button when it becomes ready */
    .confirm-btn.ready {
      animation: pulseGlow 2s ease-in-out infinite;
    }

    /* ============================================================
       PAGE LAYOUT
    ============================================================ */
    .page-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3.5rem;
      width: 100%;
      max-width: 1200px;
    }

    .brand-block {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5rem;
      max-width: 340px;
    }

    .brand-logo {
      width: 320px;
      height: auto;
      display: block;
      transition: opacity 0.35s ease;
    }

    .brand-logo--light { display: block; }
    .brand-logo--dark  { display: none;  }

    html.dark .brand-logo--light { display: none;  }
    html.dark .brand-logo--dark  { display: block; }

    .brand-subtitle {
      font-family: 'Lexend', sans-serif;
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      transition: color 0.35s ease;
      max-width: 320px;
    }

    /* ============================================================
       THEME SWITCH
    ============================================================ */
    .theme-switch {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
    }

    .switch-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch-label {
      display: block;
      width: 76px;
      height: 38px;
      border-radius: 999px;
      background: var(--switch-track);
      box-shadow:
        inset 0 3px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 2px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      position: relative;
      transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      user-select: none;
    }

    html.dark .switch-label {
      box-shadow:
        inset 0 3px 10px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .switch-label::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      border-radius: 999px;
      background: var(--switch-track-inner);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
      transition: background 0.4s ease;
      pointer-events: none;
    }

    html.dark .switch-label::before {
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .switch-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--switch-thumb);
      box-shadow: var(--switch-thumb-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.4s ease,
        box-shadow 0.4s ease;
      z-index: 2;
    }

    .switch-input:checked + .switch-label .switch-thumb {
      transform: translateX(38px);
    }

    .switch-thumb i {
      font-size: 0.85rem;
      color: var(--switch-icon);
      transition: color 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .switch-input:not(:checked) + .switch-label .switch-thumb i {
      color: var(--switch-icon);
    }

    .switch-input:checked + .switch-label .switch-thumb i {
      color: var(--switch-active-icon);
      transform: rotate(360deg);
    }

    .switch-label::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      pointer-events: none;
      background:
        radial-gradient(circle at 22% 50%, rgba(148, 163, 184, 0.35) 1.2px, transparent 1.5px),
        radial-gradient(circle at 30% 30%, rgba(148, 163, 184, 0.25) 0.8px, transparent 1.2px),
        radial-gradient(circle at 60% 70%, rgba(148, 163, 184, 0.2) 0.8px, transparent 1.2px);
      opacity: 0.5;
      transition: opacity 0.4s ease;
    }

    html.dark .switch-label::after {
      background:
        radial-gradient(circle at 75% 30%, rgba(255, 255, 255, 0.5) 1px, transparent 1.4px),
        radial-gradient(circle at 82% 60%, rgba(255, 255, 255, 0.35) 0.8px, transparent 1.2px),
        radial-gradient(circle at 68% 75%, rgba(255, 255, 255, 0.25) 0.7px, transparent 1px);
      opacity: 0.7;
    }

    .switch-input:focus-visible + .switch-label {
      box-shadow:
        inset 0 3px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 2px rgba(0, 0, 0, 0.2),
        0 0 0 4px rgba(148, 163, 184, 0.25);
    }

    /* ============================================================
       PICKER CARD – TRULY CARVED INTO THE PAGE
    ============================================================ */
    .picker-card {
      background: var(--bg-card);
      flex: 1 1 auto;
      width: 100%;
      max-width: 780px;
      border-radius: 28px;
      padding: 2rem 2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      position: relative;
      background-image: linear-gradient(180deg,
        var(--bg-card-deep) 0%,
        var(--bg-card) 30%,
        var(--bg-card) 100%);
      box-shadow: var(--shadow-card-carved);
      transition: background 0.4s ease, box-shadow 0.35s ease;
    }

    .picker-card::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 22px;
      pointer-events: none;
      box-shadow:
        inset 0 1px 2px rgba(15, 23, 42, 0.06),
        inset 0 -1px 1px rgba(255, 255, 255, 0.5);
      z-index: 0;
    }

    html.dark .picker-card::after {
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.5),
        inset 0 -1px 1px rgba(255, 255, 255, 0.02);
    }

    .picker-card > * {
      position: relative;
      z-index: 1;
    }

    /* ---- dropdown section ---- */
    .field-group {
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 10;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.7rem;
      transition: color 0.3s ease;
    }

    .field-label i {
      font-size: 0.9rem;
      color: var(--text-faint);
      transition: color 0.3s ease;
    }

    .custom-dropdown {
      position: relative;
      width: 100%;
      user-select: none;
    }

    .dropdown-trigger {
      width: 100%;
      padding: 1rem 1.5rem;
      font-family: 'Lexend', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-primary);
      background: var(--bg-subtle);
      border: 1px solid var(--border-input);
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.3s ease, color 0.25s ease;
      outline: none;
      text-align: left;
      gap: 0.75rem;
      box-shadow: var(--shadow-input-inset);
    }

    html.dark .dropdown-trigger {
      background: var(--bg-card-inner);
    }

    .dropdown-trigger:hover {
      border-color: var(--border-input-hover);
    }

    .dropdown-trigger:focus-visible {
      border-color: var(--border-input-focus);
      box-shadow:
        var(--shadow-input-inset),
        0 0 0 4px rgba(148, 163, 184, 0.15);
    }

    .custom-dropdown.open .dropdown-trigger {
      border-color: var(--border-input-focus);
      box-shadow:
        var(--shadow-input-inset),
        0 0 0 4px rgba(148, 163, 184, 0.12);
    }

    .trigger-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .trigger-left i {
      font-size: 1.1rem;
      color: var(--icon-color);
      flex-shrink: 0;
      transition: color 0.3s ease;
    }

    .chevron-icon {
      width: 1.15rem;
      height: 1.15rem;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
    }

    .custom-dropdown.open .chevron-icon {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      box-shadow: var(--shadow-menu);
      padding: 0.5rem;
      list-style: none;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px) scale(0.97);
      transform-origin: top center;
      pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.3s ease,
                  border-color 0.3s ease;
      max-height: 0;
      visibility: hidden;
    }

    .custom-dropdown.open .dropdown-menu {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      max-height: 400px;
      visibility: visible;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  max-height 0.4s ease,
                  visibility 0s;
    }

    .dropdown-option {
      padding: 0.8rem 1.1rem;
      font-family: 'Lexend', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-secondary);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      transition: background 0.2s ease, color 0.15s ease, padding-left 0.2s ease;
      opacity: 0;
      transform: translateX(-6px);
      animation: optionFadeIn 0.35s forwards;
      animation-delay: calc(var(--index, 0) * 0.04s);
    }

    @keyframes optionFadeIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .dropdown-option:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
      padding-left: 1.4rem;
    }

    .dropdown-option.selected {
      background: var(--bg-hover);
      color: var(--text-primary);
      font-weight: 500;
    }

    .option-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .option-left i {
      font-size: 1rem;
      color: var(--icon-color);
      flex-shrink: 0;
      transition: color 0.3s ease;
    }

    .dropdown-option.selected .option-left i {
      color: var(--icon-color-selected);
    }

    .option-check {
      width: 1rem;
      height: 1rem;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--icon-color-selected);
    }

    .dropdown-option.selected .option-check {
      opacity: 1;
      transform: scale(1);
    }

    /* ---- calendar section ---- */
    .calendar-section {
      margin-top: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }

    .calendar-title-group {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .calendar-title-group i {
      font-size: 1.15rem;
      color: var(--icon-color);
      transition: color 0.3s ease;
    }

    .calendar-header h3 {
      font-family: 'Lexend', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      transition: color 0.3s ease;
    }

    .range-summary {
      font-family: 'Lexend', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .range-summary .range-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.32rem 0.8rem;
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.75rem;
      white-space: nowrap;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-nested-inset);
    }

    .range-summary .range-chip i {
      font-size: 0.7rem;
    }

    .range-summary .range-chip.in {
      background: var(--bg-chip-in);
      color: #10b981;
      box-shadow: var(--shadow-nested-inset), inset 0 0 0 1px #a7f3d0;
    }

    html.dark .range-summary .range-chip.in {
      color: #6ee7b7;
      box-shadow: var(--shadow-nested-inset), inset 0 0 0 1px #1a5a44;
    }

    .range-summary .range-chip.in i {
      color: #10b981;
    }

    .range-summary .range-chip.out {
      background: var(--bg-chip-out);
      color: #dc2626;
      box-shadow: var(--shadow-nested-inset), inset 0 0 0 1px #fecaca;
    }

    html.dark .range-summary .range-chip.out {
      color: #fca5a5;
      box-shadow: var(--shadow-nested-inset), inset 0 0 0 1px #6b2e2e;
    }

    .range-summary .range-chip.out i {
      color: #ef4444;
    }

    .range-summary .range-chip.nights {
      background: var(--bg-chip-nights);
      color: #2563eb;
      box-shadow: var(--shadow-nested-inset), inset 0 0 0 1px #bfdbfe;
    }

    html.dark .range-summary .range-chip.nights {
      color: #93c5fd;
      box-shadow: var(--shadow-nested-inset), inset 0 0 0 1px #1f3a5c;
    }

    .range-summary .range-chip.nights i {
      color: #3b82f6;
    }

    .range-summary .range-chip small {
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ---- months: deeply carved nested panels ---- */
    .months-container {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .month {
      flex: 1 1 260px;
      min-width: 240px;
      background: var(--bg-card-inner);
      border-radius: 20px;
      padding: 1.1rem 0.5rem 1rem 0.5rem;
      transition: background 0.35s ease, box-shadow 0.35s ease;
      box-shadow: var(--shadow-month-carved);
      border: 1px solid var(--border-soft);
      position: relative;
    }

    .month::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 16px;
      pointer-events: none;
      box-shadow:
        inset 0 1px 2px rgba(15, 23, 42, 0.05),
        inset 0 -1px 1px rgba(255, 255, 255, 0.4);
    }

    html.dark .month::after {
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.4),
        inset 0 -1px 1px rgba(255, 255, 255, 0.02);
    }

    /* ---- month header with nav arrows ---- */
    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding: 0 0.5rem;
      position: relative;
      z-index: 1;
    }

    .month-title {
      text-align: center;
      font-family: 'Lexend', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
      transition: color 0.3s ease;
      flex: 1;
    }

    .nav-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: none;
      background: var(--bg-card);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
      box-shadow: var(--shadow-nav-btn);
      flex-shrink: 0;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .nav-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.95);
    }

    .nav-btn:focus-visible {
      box-shadow:
        var(--shadow-nav-btn),
        0 0 0 3px rgba(148, 163, 184, 0.25);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      color: var(--text-placeholder);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-family: 'Lexend', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      color: var(--text-faint);
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      padding: 0 0.25rem;
      transition: color 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      padding: 0 0.25rem;
      position: relative;
      z-index: 1;
    }

    .day {
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Lexend', sans-serif;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-primary);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.15s ease, box-shadow 0.18s ease, transform 0.1s ease;
      background: transparent;
      user-select: none;
      line-height: 1;
      position: relative;
      padding: 2px;
    }

    .day .date-label {
      font-family: 'Lexend', sans-serif;
      font-size: 0.45rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .day.empty {
      cursor: default;
      color: var(--text-placeholder);
      background: transparent;
      pointer-events: none;
    }

    /* ---- DISABLED (past) DAYS ---- */
    .day.disabled {
      color: var(--text-disabled);
      cursor: not-allowed;
      pointer-events: none;
      background: transparent;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      text-decoration-color: var(--text-disabled);
      opacity: 0.55;
    }

    .day.disabled:hover {
      background: transparent;
      box-shadow: none;
    }

    .day:not(.empty):not(.disabled):hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      box-shadow: var(--shadow-nested-inset);
    }

    .day:not(.empty):not(.disabled):active {
      transform: scale(0.94);
    }

    .day.today:not(.disabled) {
      font-weight: 600;
      color: var(--text-primary);
      box-shadow: inset 0 0 0 1.5px var(--border-input-hover);
    }

    .day.in-range:not(.disabled) {
      background: var(--bg-day-inrange);
      border-radius: 6px;
      box-shadow: var(--shadow-nested-inset);
    }

    .day.check-in {
      background: var(--bg-day-checkin);
      color: #ecfdf5;
      font-weight: 600;
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.18),
        inset 0 0 0 1.5px #34d399;
      border-radius: 14px;
    }

    html:not(.dark) .day.check-in {
      color: #064e3b;
      box-shadow:
        inset 0 2px 4px rgba(6, 78, 59, 0.22),
        inset 0 0 0 1.5px #34d399;
    }

    .day.check-in .date-label {
      color: #047857;
    }

    html.dark .day.check-in .date-label {
      color: #6ee7b7;
    }

    .day.check-out {
      background: var(--bg-day-checkout);
      color: #fef2f2;
      font-weight: 600;
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.18),
        inset 0 0 0 1.5px #f87171;
      border-radius: 14px;
    }

    html:not(.dark) .day.check-out {
      color: #7f1d1d;
      box-shadow:
        inset 0 2px 4px rgba(127, 29, 29, 0.22),
        inset 0 0 0 1.5px #f87171;
    }

    .day.check-out .date-label {
      color: #b91c1c;
    }

    html.dark .day.check-out .date-label {
      color: #fca5a5;
    }

    .day.check-in .date-label,
    .day.check-out .date-label {
      opacity: 1;
      transform: scale(1);
    }

    .day.check-in .date-number,
    .day.check-out .date-number {
      font-size: 0.8rem;
      font-weight: 600;
    }

    .day .date-number {
      line-height: 1;
      transition: font-size 0.2s ease;
    }

    .day.empty:hover {
      background: transparent;
    }

    /* ---- footer ---- */
    .picker-footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      transition: border-color 0.3s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    html.dark .picker-footer {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .footer-note {
      font-family: 'Lexend', sans-serif;
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--text-faint);
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.3s ease;
    }

    .footer-note i {
      font-size: 0.85rem;
      color: var(--text-placeholder);
      transition: color 0.3s ease;
    }

    .footer-nights {
      font-family: 'Lexend', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 1.2em;
      transition: color 0.3s ease, opacity 0.25s ease;
    }

    .footer-nights i {
      font-size: 0.9rem;
      color: #3b82f6;
    }

    .footer-nights .nights-count {
      color: #2563eb;
      font-weight: 600;
    }

    html.dark .footer-nights .nights-count {
      color: #93c5fd;
    }

    .footer-nights.hidden {
      visibility: hidden;
      opacity: 0;
    }

    .confirm-btn {
      font-family: 'Lexend', sans-serif;
      background: var(--btn-bg);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 0.85rem 1.8rem;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.2s ease;
      outline: none;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        inset 0 -1px 2px rgba(255, 255, 255, 0.08);
    }

    .confirm-btn i {
      font-size: 0.95rem;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .confirm-btn:hover {
      background: var(--btn-bg-hover);
      transform: translateY(-1px);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.35),
        inset 0 -1px 2px rgba(255, 255, 255, 0.08);
    }

    .confirm-btn:hover i {
      transform: translateX(2px);
    }

    .confirm-btn:active {
      transform: translateY(0);
      box-shadow:
        inset 0 3px 6px rgba(0, 0, 0, 0.4),
        inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .confirm-btn:focus-visible {
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        inset 0 -1px 2px rgba(255, 255, 255, 0.08),
        0 0 0 4px rgba(148, 163, 184, 0.3);
    }

    .confirm-btn.ready {
      background: var(--btn-ready-bg);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.25),
        inset 0 -1px 2px rgba(255, 255, 255, 0.15);
    }

    .confirm-btn.ready:hover {
      background: var(--btn-ready-bg-hover);
      transform: translateY(-1px);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        inset 0 -1px 2px rgba(255, 255, 255, 0.15);
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 960px) {
      .page-layout {
        flex-direction: column;
        gap: 2rem;
      }
      .brand-block {
        align-items: center;
        text-align: center;
        max-width: 100%;
      }
      .brand-logo {
        width: 260px;
      }
      .brand-subtitle {
        max-width: 400px;
        text-align: center;
      }
    }

    @media (max-width: 600px) {
      .picker-card {
        padding: 1.5rem;
        border-radius: 24px;
      }
      .picker-card::after {
        inset: 4px;
        border-radius: 20px;
      }
      .theme-switch {
        top: 1rem;
        right: 1rem;
      }
      .switch-label {
        width: 68px;
        height: 34px;
      }
      .switch-thumb {
        width: 26px;
        height: 26px;
      }
      .switch-input:checked + .switch-label .switch-thumb {
        transform: translateX(34px);
      }
      .months-container {
        gap: 1rem;
      }
      .month {
        padding: 1rem 0.4rem 0.9rem 0.4rem;
      }
      .dropdown-trigger {
        padding: 0.9rem 1.2rem;
        font-size: 0.95rem;
      }
      .calendar-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .picker-footer {
        flex-direction: column;
        align-items: stretch;
      }
      .confirm-btn {
        justify-content: center;
      }
      .brand-logo {
        width: 220px;
      }
      .brand-subtitle {
        font-size: 0.95rem;
      }
      .loader-logo {
        width: 110px;
      }
    }
  </style>
</head>

<script>
  (function() {
    /* ============================================================
       0. LOADING OVERLAY
    ============================================================ */
    const loadingOverlay = document.getElementById('loadingOverlay');
    const LOAD_TIME = 1400; // ms — adjust as needed

    // Apply theme immediately (before overlay hides) so it matches
    const themeSwitch = document.getElementById('themeSwitch');
    const switchIcon = document.getElementById('switchIcon');
    const htmlEl = document.documentElement;

    let savedTheme = null;
    try { savedTheme = localStorage.getItem('picker-theme'); } catch (e) {}
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    function applyTheme(theme, updateSwitch = true) {
      if (theme === 'dark') {
        htmlEl.classList.add('dark');
        if (updateSwitch) {
          themeSwitch.checked = true;
          switchIcon.className = 'fi fi-sr-sun';
        }
      } else {
        htmlEl.classList.remove('dark');
        if (updateSwitch) {
          themeSwitch.checked = false;
          switchIcon.className = 'fi fi-sr-moon';
        }
      }
    }

    if (savedTheme) {
      applyTheme(savedTheme);
    } else if (prefersDark) {
      applyTheme('dark');
    } else {
      applyTheme('light');
    }

    themeSwitch.addEventListener('change', () => {
      const newTheme = themeSwitch.checked ? 'dark' : 'light';
      applyTheme(newTheme, false);
      switchIcon.className = newTheme === 'dark' ? 'fi fi-sr-sun' : 'fi fi-sr-moon';
      try { localStorage.setItem('picker-theme', newTheme); } catch (e) {}
    });

    // Reveal content
    function revealContent() {
      if (document.body.classList.contains('loaded')) return;
      loadingOverlay.classList.add('hidden');
      document.body.classList.remove('preload');
      document.body.classList.add('loaded');
    }

    window.addEventListener('load', () => {
      setTimeout(revealContent, LOAD_TIME);
    });

    // Safety fallback
    setTimeout(revealContent, LOAD_TIME + 3000);

    /* ============================================================
       1. CUSTOM DROPDOWN (with Cloudbeds property IDs)
    ============================================================ */
    const CLOUDBEDS_BASE = "https://hotels.cloudbeds.com/en/reservation/";

    const destinations = [
      { name: "Siem Reap",        icon: "fi fi-sr-temple",         id: "rmVKYa" },
      { name: "Phnom Penh",       icon: "fi fi-sr-building",       id: "PeZXom" },
      { name: "Kampot",           icon: "fi fi-sr-mountains",      id: "CFTvLu" },
      { name: "Sihanoukville",    icon: "fi fi-sr-beach-umbrella", id: "ZyjPPV" },
      { name: "Koh Rong Sanloem", icon: "fi fi-sr-island",         id: "VUxg0w" },
      { name: "Koh Rong",         icon: "fi fi-sr-palm-tree",      id: "XS8E0S" }
    ];

    const dropdown = document.getElementById('destinationDropdown');
    const trigger = document.getElementById('dropdownTrigger');
    const menu = document.getElementById('dropdownMenu');
    const selectedText = document.getElementById('selectedDestinationText');
    const triggerIcon = document.getElementById('triggerIcon');
    let currentSelection = destinations[0];

    const checkSvg = `<svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    function buildOptions() {
      menu.innerHTML = '';
      destinations.forEach((dest, index) => {
        const li = document.createElement('li');
        li.className = 'dropdown-option' + (dest.name === currentSelection.name ? ' selected' : '');
        li.setAttribute('role', 'option');
        li.setAttribute('aria-selected', dest.name === currentSelection.name);
        li.style.setProperty('--index', index);
        li.innerHTML = `
          <span class="option-left">
            <i class="${dest.icon}"></i>
            <span>${dest.name}</span>
          </span>
          ${checkSvg}
        `;
        li.addEventListener('click', (e) => {
          e.stopPropagation();
          selectDestination(dest);
        });
        menu.appendChild(li);
      });
    }

    function selectDestination(dest) {
      currentSelection = dest;
      selectedText.textContent = dest.name;
      triggerIcon.className = dest.icon;
      menu.querySelectorAll('.dropdown-option').forEach(opt => {
        const optName = opt.querySelector('.option-left span').textContent;
        const isSelected = optName === dest.name;
        opt.classList.toggle('selected', isSelected);
        opt.setAttribute('aria-selected', isSelected);
      });
      closeDropdown();
    }

    function openDropdown() {
      dropdown.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
    }

    function closeDropdown() {
      dropdown.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    }

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.contains('open') ? closeDropdown() : openDropdown();
    });

    document.addEventListener('click', (e) => {
      if (!dropdown.contains(e.target)) closeDropdown();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && dropdown.classList.contains('open')) {
        closeDropdown();
        trigger.focus();
      }
    });

    trigger.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!dropdown.classList.contains('open')) openDropdown();
      }
    });

    triggerIcon.className = currentSelection.icon;
    buildOptions();

    /* ============================================================
       2. CALENDAR – with month navigation & past-date disabling
    ============================================================ */
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);
    const CURRENT_YEAR = TODAY.getFullYear();
    const CURRENT_MONTH = TODAY.getMonth();

    let startMonth = { year: CURRENT_YEAR, month: CURRENT_MONTH };

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    let checkInDate = null;
    let checkOutDate = null;

    const rangeSummary = document.getElementById('rangeSummary');
    const confirmBtn = document.getElementById('confirmBtn');
    const footerNights = document.getElementById('footerNights');
    const nightsCount = document.getElementById('nightsCount');
    const monthsContainer = document.getElementById('monthsContainer');

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function getFirstDayOfMonth(year, month) {
      return new Date(year, month, 1).getDay();
    }

    function makeDate(year, month, day) {
      return new Date(year, month, day, 0, 0, 0, 0);
    }

    function isSameDay(d1, d2) {
      if (!d1 || !d2) return false;
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function isBetween(date, start, end) {
      if (!start || !end) return false;
      const t = date.getTime();
      return t > start.getTime() && t < end.getTime();
    }

    function isDisabled(date) {
      return date.getTime() < TODAY.getTime();
    }

    function calculateNights() {
      if (!checkInDate || !checkOutDate) return 0;
      const msPerNight = 24 * 60 * 60 * 1000;
      const diff = checkOutDate.getTime() - checkInDate.getTime();
      return Math.round(diff / msPerNight);
    }

    function addMonths(base, delta) {
      const total = base.year * 12 + base.month + delta;
      return { year: Math.floor(total / 12), month: ((total % 12) + 12) % 12 };
    }

    function updateRangeSummary() {
      if (!checkInDate && !checkOutDate) {
        rangeSummary.innerHTML = '';
        confirmBtn.classList.remove('ready');
        footerNights.classList.add('hidden');
        return;
      }

      const format = (d) => `${monthNames[d.getMonth()].slice(0,3)} ${d.getDate()}`;
      let html = '';
      if (checkInDate) {
        html += `<span class="range-chip in"><i class="fi fi-sr-sign-in-alt"></i> <small>IN</small> ${format(checkInDate)}</span>`;
      }
      if (checkOutDate) {
        html += `<span class="range-chip out"><i class="fi fi-sr-sign-out-alt"></i> <small>OUT</small> ${format(checkOutDate)}</span>`;
      }

      const nights = calculateNights();
      if (checkInDate && checkOutDate && nights > 0) {
        html += `<span class="range-chip nights"><i class="fi fi-sr-moon"></i> <small>NIGHTS</small> ${nights}</span>`;
      }

      rangeSummary.innerHTML = html;

      if (checkInDate && checkOutDate && nights > 0) {
        nightsCount.textContent = nights;
        footerNights.classList.remove('hidden');
        confirmBtn.classList.add('ready');
      } else {
        footerNights.classList.add('hidden');
        confirmBtn.classList.remove('ready');
      }
    }

    function updateCalendarHighlights() {
      const allDays = document.querySelectorAll('.day:not(.empty):not(.disabled)');
      allDays.forEach(dayEl => {
        dayEl.classList.remove('check-in', 'check-out', 'in-range');

        const year = parseInt(dayEl.dataset.year, 10);
        const month = parseInt(dayEl.dataset.month, 10);
        const day = parseInt(dayEl.dataset.day, 10);
        const date = makeDate(year, month, day);

        const labelSpan = dayEl.querySelector('.date-label');
        if (labelSpan) labelSpan.textContent = '';

        if (checkInDate && isSameDay(date, checkInDate)) {
          dayEl.classList.add('check-in');
          if (labelSpan) labelSpan.textContent = 'IN';
        }
        if (checkOutDate && isSameDay(date, checkOutDate)) {
          dayEl.classList.add('check-out');
          if (labelSpan) labelSpan.textContent = 'OUT';
        }
        if (checkInDate && checkOutDate && isBetween(date, checkInDate, checkOutDate)) {
          dayEl.classList.add('in-range');
        }
      });
      updateRangeSummary();
    }

    function handleDayClick(date) {
      if (isDisabled(date)) return;

      if (!checkInDate) {
        checkInDate = date;
        checkOutDate = null;
        updateCalendarHighlights();
        return;
      }

      if (checkInDate && !checkOutDate) {
        if (isSameDay(date, checkInDate)) {
          checkInDate = null;
          checkOutDate = null;
          updateCalendarHighlights();
          return;
        }
        if (date.getTime() < checkInDate.getTime()) {
          checkInDate = date;
          checkOutDate = null;
          updateCalendarHighlights();
          return;
        }
        checkOutDate = date;
        updateCalendarHighlights();
        return;
      }

      if (checkInDate && checkOutDate) {
        checkInDate = date;
        checkOutDate = null;
        updateCalendarHighlights();
      }
    }

    function createMonthBlock(year, month, { showPrev, showNext } = {}) {
      const monthDiv = document.createElement('div');
      monthDiv.className = 'month';

      const header = document.createElement('div');
      header.className = 'month-header';

      const prevBtn = document.createElement('button');
      prevBtn.className = 'nav-btn';
      prevBtn.type = 'button';
      prevBtn.setAttribute('aria-label', 'Previous month');
      prevBtn.innerHTML = '<i class="fi fi-sr-angle-left"></i>';
      prevBtn.disabled = !showPrev;
      if (showPrev) {
        prevBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          startMonth = addMonths(startMonth, -1);
          renderCalendar();
        });
      }

      const title = document.createElement('div');
      title.className = 'month-title';
      title.textContent = `${monthNames[month]} ${year}`;

      const nextBtn = document.createElement('button');
      nextBtn.className = 'nav-btn';
      nextBtn.type = 'button';
      nextBtn.setAttribute('aria-label', 'Next month');
      nextBtn.innerHTML = '<i class="fi fi-sr-angle-right"></i>';
      nextBtn.disabled = !showNext;
      if (showNext) {
        nextBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          startMonth = addMonths(startMonth, 1);
          renderCalendar();
        });
      }

      header.appendChild(prevBtn);
      header.appendChild(title);
      header.appendChild(nextBtn);
      monthDiv.appendChild(header);

      const weekdaysDiv = document.createElement('div');
      weekdaysDiv.className = 'weekdays';
      ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(day => {
        const span = document.createElement('span');
        span.textContent = day;
        weekdaysDiv.appendChild(span);
      });
      monthDiv.appendChild(weekdaysDiv);

      const daysDiv = document.createElement('div');
      daysDiv.className = 'days';

      const daysInMonth = getDaysInMonth(year, month);
      const firstDayIndex = getFirstDayOfMonth(year, month);

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'day empty';
        daysDiv.appendChild(emptyDiv);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'day';
        dayDiv.dataset.year = year;
        dayDiv.dataset.month = month;
        dayDiv.dataset.day = d;

        const cellDate = makeDate(year, month, d);
        const disabled = isDisabled(cellDate);

        if (disabled) {
          dayDiv.classList.add('disabled');
          dayDiv.setAttribute('aria-disabled', 'true');
        }

        const numSpan = document.createElement('span');
        numSpan.className = 'date-number';
        numSpan.textContent = d;
        dayDiv.appendChild(numSpan);

        const labelSpan = document.createElement('span');
        labelSpan.className = 'date-label';
        dayDiv.appendChild(labelSpan);

        if (isSameDay(cellDate, TODAY)) {
          dayDiv.classList.add('today');
        }

        if (!disabled) {
          dayDiv.addEventListener('click', function() {
            handleDayClick(cellDate);
          });
        }

        daysDiv.appendChild(dayDiv);
      }

      monthDiv.appendChild(daysDiv);
      return monthDiv;
    }

    function renderCalendar() {
      monthsContainer.innerHTML = '';

      const first = startMonth;
      const second = addMonths(startMonth, 1);

      const canGoPrev =
        first.year > CURRENT_YEAR ||
        (first.year === CURRENT_YEAR && first.month > CURRENT_MONTH);

      monthsContainer.appendChild(createMonthBlock(first.year, first.month, {
        showPrev: canGoPrev,
        showNext: false
      }));

      monthsContainer.appendChild(createMonthBlock(second.year, second.month, {
        showPrev: false,
        showNext: true
      }));

      updateCalendarHighlights();
    }

    renderCalendar();

    /* ============================================================
       3. CONFIRM BUTTON → CLOUDBEDS
    ============================================================ */
    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    confirmBtn.addEventListener('click', function() {
      if (!checkInDate || !checkOutDate) {
        confirmBtn.animate([
          { transform: 'translateX(0)' },
          { transform: 'translateX(-4px)' },
          { transform: 'translateX(4px)' },
          { transform: 'translateX(-3px)' },
          { transform: 'translateX(3px)' },
          { transform: 'translateX(0)' }
        ], { duration: 350, easing: 'ease-in-out' });
        return;
      }

      const url =
        `${CLOUDBEDS_BASE}${currentSelection.id}/` +
        `?currency=usd` +
        `&checkin=${toISODate(checkInDate)}` +
        `&checkout=${toISODate(checkOutDate)}`;

      window.open(url, '_blank', 'noopener');
    });
  })();
</script>

</body>
</html>
